<!doctype html>
<!-- Caret Launcher's feature graphic for Google Play (1024x500). Rendered to store/feature-graphic.png
     with headless Chrome; the background is store/wallpaper.py's pattern at this size. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body { background: #3B4A6B url(feature-graphic-bg.png) center / cover no-repeat;
         font-family: 'Inter', sans-serif; color: #fff; position: relative; }
  .brand { position: absolute; left: 88px; top: 50%; transform: translateY(-50%); }
  .icon { width: 120px; height: 120px; border-radius: 50%; background: #1F2229;
          box-shadow: 0 10px 30px rgba(10, 16, 34, .35); display: grid; place-items: center; }
  .name { margin-top: 30px; font-size: 58px; font-weight: 700; letter-spacing: -1.2px; line-height: 1; }
  .tagline { margin-top: 16px; font-size: 25px; font-weight: 400; color: #D7DEF2; line-height: 1.35; }
  .field { position: absolute; right: 88px; top: 262px;
           width: 360px; height: 84px; border-radius: 42px; background: #E6E8F2;
           box-shadow: 0 12px 36px rgba(10, 16, 34, .35); display: flex; align-items: center;
           padding: 0 34px; box-sizing: border-box; font-size: 34px; color: #1B1D24; }
  .caret { display: inline-block; width: 3px; height: 40px; margin-left: 3px; background: #3D5AB8; border-radius: 2px; }
  .result { position: absolute; right: 336px; top: 108px; width: 112px; height: 132px;
            border-radius: 22px; border: 3px solid rgba(230, 232, 242, .85); box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .result .app { width: 64px; height: 64px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .result .label { font-size: 18px; font-weight: 600; }
</style></head>
<body>
  <div class="brand">
    <div class="icon">
      <svg width="120" height="120" viewBox="18 18 72 72"><path d="M54,37L54,71M45,35Q54,35 54,41Q54,35 63,35M45,73Q54,73 54,67Q54,73 63,73" fill="none" stroke="#8AB4F8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="name">Caret Launcher</div>
    <div class="tagline">Just type to launch.<br>The keyboard is your home screen.</div>
  </div>
  <div class="result">
    <div class="app">
      <svg width="38" height="38" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" fill="#E8EDFB"/><circle cx="9" cy="9.5" r="2" fill="#F4B400"/><path d="M4 18l5-5.5 3.5 3.5 3-3L20 18z" fill="#34A853"/><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="#4285F4" stroke-width="1.6"/></svg>
    </div>
    <div class="label">Photos</div>
  </div>
  <div class="field"><span>gall</span><span class="caret"></span></div>
</body></html>
